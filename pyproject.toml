[project]
name = "daleel"
version = "0.1.0"
description = "Bilingual Arabic/English assistant that answers questions over public documents"
readme = "README.md"
authors = [
    { name = "Youssef", email = "132972304+youssefswilam@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
daleel = "daleel:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

